<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="RoamWithPranit — Plan, Explore, Capture and Relive your adventures." />
    <meta name="theme-color" content="#10B981" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>RoamWithPranit</title>
    <!-- MapMyIndia (Mappls) Map SDK -->
    <script src="https://apis.mappls.com/advancedmaps/api/lifbgrgdylewzefownzpslvqbdqdgtgdvtmk/map_sdk?v=3.0&layer=vector"></script>
    <!-- MapMyIndia Places Plugin -->
    <script src="https://apis.mappls.com/advancedmaps/api/lifbgrgdylewzefownzpslvqbdqdgtgdvtmk/map_sdk_plugins?v=3.0"></script>
    <script>
      window._mapplsReady = false;
      function _onMapplsLoad() {
        window._mapplsReady = true;
        window.dispatchEvent(new CustomEvent('mappls:ready'));
      }
      // fallback if scripts already fired
      window.addEventListener('load', function () {
        if (!window._mapplsReady && window.mappls) {
          window._mapplsReady = true;
          window.dispatchEvent(new CustomEvent('mappls:ready'));
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
